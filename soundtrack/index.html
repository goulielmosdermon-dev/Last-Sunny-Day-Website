<script>
(function () {
  var list = document.querySelector('.soundtrack__list');
  var audio = document.getElementById('soundtrack-audio');
  var scoreAudio = document.getElementById('score-audio');
  if (!list || !audio) return;

  var current = null;

  function label(btn, playing) {
    var name = btn.querySelector('.soundtrack__name').textContent;
    btn.classList.toggle('is-playing', playing);
    btn.setAttribute('aria-label', (playing ? 'Pause ' : 'Play ') + name);
  }

  list.addEventListener('click', function (e) {
    var btn = e.target.closest('.soundtrack__btn');
    if (!btn) return;
    var src = btn.getAttribute('data-src');
    if (current === btn && !audio.paused) {
      audio.pause();
      return;
    }
    if (scoreAudio && !scoreAudio.paused) scoreAudio.pause();
    if (current && current !== btn) label(current, false);
    current = btn;
    if (audio.getAttribute('src') !== src) audio.src = src;
    audio.play().catch(function () {});
  });

  audio.addEventListener('play', function () {
    if (current) label(current, true);
    if (scoreAudio && !scoreAudio.paused) scoreAudio.pause();
  });

  audio.addEventListener('pause', function () {
    if (current) label(current, false);
  });

  audio.addEventListener('ended', function () {
    if (current) label(current, false);
  });

  if (scoreAudio) {
    scoreAudio.addEventListener('play', function () {
      if (!audio.paused) audio.pause();
    });
  }
})();
</script>
