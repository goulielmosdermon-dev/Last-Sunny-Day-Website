<script>
(function () {
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- Split body copy into lines ---- */
  var bodyCopy = document.querySelectorAll(
    '.header__logline, .prose p'
  );

  function splitLines(el) {
    if (el.dataset.html === undefined) el.dataset.html = el.innerHTML;
    el.innerHTML = el.dataset.html;

    // Wrap every word so we can measure where the browser broke each line.
    var nodes = Array.prototype.slice.call(el.childNodes);
    var flat = document.createDocumentFragment();

    nodes.forEach(function (node) {
      if (node.nodeType === 3) {
        node.textContent.split(/(\s+)/).forEach(function (chunk) {
          if (!chunk) return;
          if (/^\s+$/.test(chunk)) {
            flat.appendChild(document.createTextNode(' '));
          } else {
            var w = document.createElement('span');
            w.className = 'w';
            w.textContent = chunk;
            flat.appendChild(w);
          }
        });
      } else {
        flat.appendChild(node.cloneNode(true));
      }
    });

    el.innerHTML = '';
    el.appendChild(flat);

    // Group words by their vertical offset, then wrap each group as a line.
    var kids = Array.prototype.slice.call(el.childNodes);
    var lines = [];
    var current = [];
    var lastTop = null;

    kids.forEach(function (node) {
      if (node.nodeType === 1 && node.tagName === 'BR') {
        lines.push(current); current = []; lastTop = null;
        return;
      }
      if (node.nodeType === 1 && node.classList.contains('w')) {
        var top = node.offsetTop;
        if (lastTop !== null && top > lastTop) {
          lines.push(current); current = [];
        }
        lastTop = top;
      }
      current.push(node);
    });
    if (current.length) lines.push(current);

    el.innerHTML = '';
    lines.forEach(function (group) {
      if (!group.length) return;
      var line  = document.createElement('span');
      var inner = document.createElement('span');
      line.className = 'ln';
      inner.className = 'ln__i';
      group.forEach(function (n) { inner.appendChild(n); });
      line.appendChild(inner);
      el.appendChild(line);
    });

    Array.prototype.forEach.call(el.querySelectorAll('.ln__i'), function (i, idx) {
      i.style.transitionDelay = (idx * 0.06) + 's';
    });
  }

  if (!reduced) Array.prototype.forEach.call(bodyCopy, splitLines);

  /* ---- Headings fade in ---- */
  var headings = document.querySelectorAll(
    '.prose__heading, .soundtrack__heading, .refs__heading, .cast__portrait'
  );
  Array.prototype.forEach.call(headings, function (h) { h.classList.add('reveal'); });

  /* ---- Observe everything ---- */
  var targets = []
    .concat(Array.prototype.slice.call(headings))
    .concat(Array.prototype.slice.call(bodyCopy))
    .concat(Array.prototype.slice.call(document.querySelectorAll('.gallery__grid img')));

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-inview');
        io.unobserve(entry.target);
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });

    targets.forEach(function (t) { io.observe(t); });
  } else {
    targets.forEach(function (t) { t.classList.add('is-inview'); });
  }

  /* ---- Re-split lines on resize ---- */
  var resizeTimer;
  window.addEventListener('resize', function () {
    if (reduced) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      Array.prototype.forEach.call(bodyCopy, function (el) {
        var seen = el.classList.contains('is-inview');
        splitLines(el);
        if (seen) el.classList.add('is-inview');
      });
    }, 200);
  });

  /* ---- Lightbox ---- */
  var box   = document.getElementById('lightbox');
  if (!box) return;
  var boxImg = box.querySelector('img');
  var close = box.querySelector('.lightbox__close');
  var lastFocus = null;

  function open(src, alt) {
    lastFocus = document.activeElement;
    boxImg.src = src;
    boxImg.alt = alt || '';
    box.hidden = false;
    requestAnimationFrame(function () { box.classList.add('is-open'); });
    document.body.style.overflow = 'hidden';
    close.focus();
  }

  function shut() {
    box.classList.remove('is-open');
    document.body.style.overflow = '';
    setTimeout(function () {
      box.hidden = true;
      boxImg.removeAttribute('src');
    }, 350);
    if (lastFocus) lastFocus.focus();
  }

  document.querySelector('.gallery__grid').addEventListener('click', function (e) {
    var img = e.target.closest('img');
    if (!img) return;
    if (document.getElementById('gallery').classList.contains('gallery--full')) return;
    open(img.currentSrc || img.src, img.alt);
  });

  close.addEventListener('click', shut);
  box.addEventListener('click', function (e) { if (e.target === box) shut(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && box.classList.contains('is-open')) shut();
  });
})();
</script>
